<script>
(()=>{'use strict';
const form=document.getElementById('access-form'),input=document.getElementById('access-code'),button=document.getElementById('open-report'),status=document.getElementById('access-status');
const payload=JSON.parse(document.getElementById('encrypted-report').textContent);
const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;
if(!globalThis.crypto?.subtle){status.textContent='当前浏览器不支持安全解密，请用最新版浏览器打开 HTTPS 分享链接。';return;}
button.disabled=true;form.setAttribute('aria-busy','true');status.textContent='正在打开报告…';
try{
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value.trim()),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
const report=new TextDecoder('utf-8',{fatal:true}).decode(clear);input.value='';document.open();document.write(report);document.close();
}catch(error){status.textContent=error.name==='OperationError'?'口令不正确，请核对后重试。':'报告暂时无法打开，请刷新后重试或联系分享人。';input.setAttribute('aria-invalid','true');input.focus();input.select();}
finally{button.disabled=false;form.removeAttribute('aria-busy');}
});
input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');status.textContent='';});
})();
</script></body></html>
